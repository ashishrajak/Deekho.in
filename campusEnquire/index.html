   <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WKFX2NZZ"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

 
  <div id="app-root">
    <!-- Spinner Component -->
    <div id="spinner" class="ngx-spinner-overlay" style="display: none;">
      <div class="ball-scale-multiple">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="loading-text">Loading...</div>
    </div>
    
    <header id="header-background" class="masthead text-white">
      <div class="for-welcome-logo">
        <img src="https://via.placeholder.com/200x60?text=Botho+University" alt="Botho University Logo">
      </div>
      
      <div class="container">
        <div class="admission-form">
          <h4 class="text-center" style="font-size: 20px; padding: 1rem; font-weight: normal; color: #5c0000;">
            Enquiry Form - Botho Universi. devvvvvv.  Online (Test Version)
          </h4>
          
          <div class="radio-box text-left">
            <form id="enquiryForm" novalidate class="admission-form1">
              <!-- Only Name Field - keeping all original classes and attributes -->
              <div class="row mb-2">
                <div class="col-md-12 mb-2">
                  <label for="enquirerFirstName" class="form-label">Full Name</label>
                  <span class="text-danger">*</span>
                  <input type="text" 
                         id="enquirerFirstName" 
                         name="enquirerFirstName"
                         class="form-control" 
                         required
                         placeholder="Enter your full name">
                  <div id="nameError" class="error-message" style="display: none;">Please enter your full name</div>
                </div>
              </div>
              
              <div class="form-footer text-right" style="padding-left: 0;">
                <button id="submitButton" class="btn btn-success getACall">Get a call back</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </header>
  </div>

  <script>
    // DOM Elements
    const form = document.getElementById('enquiryForm');
    const nameInput = document.getElementById('enquirerFirstName');
    const submitButton = document.getElementById('submitButton');
    const spinner = document.getElementById('spinner');
    const nameError = document.getElementById('nameError');
    
    // Form validation state
    let isFormValid = false;
    
    // Function to show spinner
    function showSpinner() {
      spinner.style.display = 'block';
    }
    
    // Function to hide spinner
    function hideSpinner() {
      spinner.style.display = 'none';
    }
    
    // Function to validate the form (same business logic)
    function validateForm() {
      let isValid = true;
      
      // Validate Name field
      if (!nameInput.value || nameInput.value.trim() === '') {
        nameInput.classList.add('ng-invalid');
        nameInput.classList.remove('ng-valid');
        nameError.style.display = 'block';
        isValid = false;
      } else {
        nameInput.classList.remove('ng-invalid');
        nameInput.classList.add('ng-valid');
        nameError.style.display = 'none';
      }
      
      isFormValid = isValid;
      
      // Enable/disable submit button based on validation
      if (isFormValid) {
        submitButton.removeAttribute('disabled');
        submitButton.classList.remove('disabled');
      } else {
        submitButton.setAttribute('disabled', 'disabled');
        submitButton.classList.add('disabled');
      }
      
      return isValid;
    }
    
    // Real-time validation on input
    nameInput.addEventListener('input', function() {
      validateForm();
      
      // Add touch/dirty classes for styling
      this.classList.add('ng-dirty', 'ng-touched');
      if (this.value && this.value.trim() !== '') {
        this.classList.add('ng-valid');
        this.classList.remove('ng-invalid');
      } else {
        this.classList.add('ng-invalid');
        this.classList.remove('ng-valid');
      }
    });
    
    // Function to simulate form submission (same business logic)
    async function submitForm() {
      if (!validateForm()) {
        console.log('Form validation failed');
        return false;
      }
      
      // Get form data
      const formData = {
        enquirerFirstName: nameInput.value.trim(),
        timestamp: new Date().toISOString(),
        formType: 'enquiry_test'
      };
      
      console.log('Form submission started:', formData);
      showSpinner();
      
      // Simulate API call (same as original business logic)
      try {
        // Simulating network request delay
        await new Promise((resolve, reject) => {
          setTimeout(() => {
            // Simulate 90% success rate for testing
            const isSuccess = Math.random() > 0.1;
            if (isSuccess) {
              resolve({ success: true, message: 'Enquiry submitted successfully!' });
            } else {
              reject({ success: false, message: 'Submission failed. Please try again.' });
            }
          }, 1500);
        });
        
        // Success handling
        hideSpinner();
        
        // Show success message (using SweetAlert style)
        showAlert('Success!', `Thank you ${formData.enquirerFirstName}! Your enquiry has been submitted successfully.`, 'success');
        
        // Reset form
        form.reset();
        nameInput.classList.remove('ng-dirty', 'ng-touched', 'ng-valid');
        submitButton.setAttribute('disabled', 'disabled');
        isFormValid = false;
        
        // Track form submission success (for GTM)
        
        
        // Facebook Pixel tracking (if available)
        if (typeof fbq !== 'undefined') {
          fbq('track', 'Lead', {
            content_name: 'Enquiry Form Submission',
            status: 'success'
          });
        }
        
        console.log('Form submission success:', formData);
        return true;
        
      } catch (error) {
        // Error handling
        hideSpinner();
        showAlert('Error!', error.message || 'Something went wrong. Please try again.', 'error');
        console.error('Form submission error:', error);
        
        // Track form submission error (for GTM)
        
        
        return false;
      }
    }
    
    // Alert function (mimicking SweetAlert style)
    function showAlert(title, message, type) {
      // Create modal container
      const modal = document.createElement('div');
      modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        animation: fadeIn 0.3s ease;
      `;
      
      const modalContent = document.createElement('div');
      modalContent.style.cssText = `
        background: white;
        border-radius: 8px;
        padding: 20px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        animation: slideIn 0.3s ease;
      `;
      
      const iconColor = type === 'success' ? '#198754' : '#dc3545';
      const iconSymbol = type === 'success' ? '✓' : '✗';
      
      modalContent.innerHTML = `
        <div style="font-size: 48px; color: ${iconColor}; margin-bottom: 10px;">${iconSymbol}</div>
        <h3 style="margin: 0 0 10px 0; color: #333;">${title}</h3>
        <p style="margin: 0 0 20px 0; color: #666;">${message}</p>
        <button id="alertCloseBtn" style="
          background-color: ${iconColor};
          color: white;
          border: none;
          padding: 10px 20px;
          border-radius: 5px;
          cursor: pointer;
          font-size: 14px;
        ">OK</button>
      `;
      
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      
      const closeBtn = modalContent.querySelector('#alertCloseBtn');
      closeBtn.addEventListener('click', function() {
        modal.style.animation = 'fadeOut 0.3s ease';
        setTimeout(() => {
          modal.remove();
        }, 300);
      });
      
      // Add animations
      const style = document.createElement('style');
      style.textContent = `
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes fadeOut {
          from { opacity: 1; }
          to { opacity: 0; }
        }
        @keyframes slideIn {
          from { transform: translateY(-50px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
      `;
      document.head.appendChild(style);
    }
    
    // Form submit handler (same as original)
    submitButton.addEventListener('click', function(e) {
      e.preventDefault();
      if (isFormValid) {
        submitForm();
      } else {
        validateForm();
        console.log('Please fill in all required fields');
      }
    });
    
    // Initialize form - set button to disabled initially
    submitButton.setAttribute('disabled', 'disabled');
    submitButton.classList.add('disabled');
    
    // Add keyboard submit support
    nameInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && isFormValid) {
        e.preventDefault();
        submitForm();
      }
    });
    
    // Console log for GTM testing
    console.log('Form initialized. Button ID: submitButton, Class: getACall');
    console.log('Form classes:', form.className);
    console.log('Button classes:', submitButton.className);
    
    // Expose for debugging (same as original structure)
    window.enquiryForm = {
      validate: validateForm,
      submit: submitForm,
      getFormData: () => ({ enquirerFirstName: nameInput.value.trim() })
    };
  </script>
